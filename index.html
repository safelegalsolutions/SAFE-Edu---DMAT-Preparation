<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dMAT Practice Sampler — SAFE Edu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--surface:#ffffff;--ink:#1e2a3a;--muted:#5b6778;--line:#cfd5dd;--signal:#ffc928;--signal-ink:#1e2a3a;--ok:#1f8a5b;--bad:#c23b22;--sel:#2c5fd8;--selbg:#e8eefc;--grid:#8a93a0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111821;--surface:#1a2330;--ink:#e7ecf2;--muted:#9aa6b6;--line:#2e3a4a;--signal:#ffc928;--signal-ink:#1e2a3a;--ok:#4cc38a;--bad:#ff7a5c;--sel:#7aa2ff;--selbg:#22304a;--grid:#6c7888}}
:root[data-theme="dark"]{--bg:#111821;--surface:#1a2330;--ink:#e7ecf2;--muted:#9aa6b6;--line:#2e3a4a;--ok:#4cc38a;--bad:#ff7a5c;--sel:#7aa2ff;--selbg:#22304a;--grid:#6c7888}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
button{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 60px}
header.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
.brand h1{font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0;letter-spacing:-.01em}
.brand h1 span{display:block;font-size:.42em;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.band{margin:0 0 26px}
.band h2{font-size:20px;margin:0 0 4px}
.band p{margin:0 0 12px;color:var(--muted);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 8px 8px;text-align:left;cursor:pointer;min-height:74px;display:flex;flex-direction:column;justify-content:space-between}
.tile:hover{border-color:var(--ink)}
.tile b{font-size:22px;line-height:1}
.tile small{color:var(--muted);font-size:12px;line-height:1.25}
.tile.done{border-color:var(--ok)}
.tile.done small{color:var(--ok)}
.meter{display:flex;gap:3px;margin-top:6px}.meter i{flex:1;height:5px;border-radius:2px;background:var(--line)}.meter i.on{background:var(--signal)}
.tile.locked{background:transparent;border-style:dashed;cursor:default;opacity:.75}
.tile.locked small{color:var(--muted)}
.promo{background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--signal);border-radius:12px;padding:16px 18px;margin:0 0 24px}
.promo h2{margin:0 0 6px;font-size:20px}.promo p{margin:0 0 10px}
.promo a.btn{display:inline-block;text-decoration:none;color:var(--bg);background:var(--ink);margin-right:8px;margin-top:4px}
.promo a.btn.ghost{background:var(--surface);color:var(--ink)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:20px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}
.mode{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;text-align:left}
.mode:hover{border-color:var(--ink)}
.mode h3{margin:0 0 4px;font-size:18px}.mode p{margin:0;color:var(--muted);font-size:15px}
.secpick{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1.5px solid var(--line);margin-bottom:16px}
.barrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.clock{font-family:"Atkinson Hyperlegible Mono",ui-monospace,monospace;font-size:22px;background:var(--signal);color:var(--signal-ink);padding:2px 10px;border-radius:6px}
.clock.low{background:var(--bad);color:#fff}
.timeline{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}.timeline div{height:100%;background:var(--ink);transition:width 1s linear}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.nav button{width:30px;height:30px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;padding:0}
.nav button.ans{background:var(--selbg);border-color:var(--sel)}
.nav button.cur{outline:2.5px solid var(--ink);outline-offset:1px}
.nav button.r-ok{background:var(--ok);color:#fff;border-color:var(--ok)}.nav button.r-bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}
.stem{font-size:18px;margin:0 0 14px}
.eqs{font-family:"Atkinson Hyperlegible Mono",ui-monospace,monospace;font-size:21px;line-height:1.9;background:var(--bg);border-radius:10px;padding:10px 16px;display:inline-block;margin-bottom:14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface);cursor:pointer}
.opt .k{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--sel);background:var(--selbg)}.opt[aria-pressed="true"] .k{background:var(--sel);color:#fff;border-color:var(--sel)}
.opt.right{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}.opt.wrong{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.lsrow{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
table.ls{border-collapse:collapse;font-family:"Atkinson Hyperlegible Mono",ui-monospace,monospace;font-size:22px}
table.ls td,table.ls th{width:46px;height:46px;text-align:center;border:1.5px solid var(--grid)}
table.ls th{border:none;color:var(--muted);font-size:13px;font-weight:400;width:auto;height:auto;padding:2px 6px}
table.ls td.t{background:var(--signal);color:var(--signal-ink);font-weight:700}
.letters{display:flex;gap:8px;flex-wrap:wrap}.letters .opt{width:58px;justify-content:center;font-size:20px;padding:10px 0}
.fsgiven{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.fsbox{text-align:center;font-size:13px;color:var(--muted)}
.fsq{margin-top:10px}.fsq h4{margin:10px 0 6px;font-size:16px}
.fsopts{display:flex;gap:10px;flex-wrap:wrap}
.fsopt{border:2px solid var(--line);border-radius:10px;padding:6px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.fsopt[aria-pressed="true"]{border-color:var(--sel);background:var(--selbg)}.fsopt.right{border-color:var(--ok)}.fsopt.wrong{border-color:var(--bad)}
svg.mx{display:block;background:#fff;border-radius:4px}
.logic{margin-top:16px;border-left:4px solid var(--signal);padding:8px 14px;background:var(--bg);border-radius:0 8px 8px 0}
.logic h4{margin:0 0 6px;font-size:15px}
.logic ol,.logic ul{margin:0;padding-left:20px}.logic li{margin:3px 0}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:var(--surface);padding:10px 18px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.passage{background:var(--bg);border-radius:10px;padding:14px 18px;margin-bottom:16px;max-height:46vh;overflow:auto;font-size:16px}
.passage h3{margin:0 0 6px}.passage p{margin:0 0 10px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}
.res div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px}
.res b{font-size:30px;display:block}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin-top:26px;border-top:1.5px solid var(--line);padding-top:12px}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){table.ls td{width:40px;height:40px}.eqs{font-size:18px}}
</style>
</head>

<script>
const CORE = [{"id":1,"FS":[{"type":"FS","level":1,"shapes":["flag"],"given":[[[2,2,0,"blue"]],[[1,2,0,"blue"]],[[0,2,0,"blue"]],[[1,2,0,"blue"]]],"q5":[[[1,2,0,"blue"]],[[2,2,0,"white"]],[[2,2,0,"blue"]]],"a5":2,"q6":[[[3,2,0,"yellow"]],[[3,2,0,"blue"]],[[3,3,0,"blue"]]],"a6":1,"logic":["The blue flag moves vertically one field at a time in the third column, first moving up, and bounces off the top/bottom border.","Continue every rule two more steps: Matrix 5 is option 3, Matrix 6 is option 2."]},{"type":"FS","level":1,"shapes":["wedge"],"given":[[[2,3,90,"white"]],[[1,3,90,"white"]],[[0,3,90,"white"]],[[1,3,90,"white"]]],"q5":[[[2,3,90,"white"]],[[2,3,90,"blue"]],[[2,3,270,"white"]]],"a5":0,"q6":[[[3,3,90,"black"]],[[3,3,0,"white"]],[[3,3,90,"white"]]],"a6":2,"logic":["The white wedge moves vertically one field at a time in the fourth column, first moving up, and bounces off the top/bottom border.","Continue every rule two more steps: Matrix 5 is option 1, Matrix 6 is option 3."]},{"type":"FS","level":1,"shapes":["wedge"],"given":[[[3,1,0,"black"]],[[2,1,0,"black"]],[[1,1,0,"black"]],[[0,1,0,"black"]]],"q5":[[[1,1,0,"black"]],[[1,1,270,"black"]],[[1,1,0,"orange"]]],"a5":0,"q6":[[[2,1,0,"blue"]],[[2,1,180,"black"]],[[2,1,0,"black"]]],"a6":2,"logic":["The black wedge moves vertically one field at a time in the second column, first moving up, and bounces off the top/bottom border.","Continue every rule two more steps: Matrix 5 is option 1, Matrix 6 is option 3."]},{"type":"FS","level":1,"shapes":["wedge"],"given":[[[3,2,270,"white"]],[[3,1,270,"white"]],[[3,0,270,"white"]],[[3,1,270,"white"]]],"q5":[[[3,2,270,"yellow"]],[[3,2,270,"white"]],[[3,2,270,"blue"]]],"a5":1,"q6":[[[3,2,270,"white"]],[[3,3,90,"white"]],[[3,3,270,"white"]]],"a6":2,"logic":["The white wedge moves horizontally one field at a time in the fourth row, first moving left, and bounces off the left/right border.","Continue every rule two more steps: Matrix 5 is option 2, Matrix 6 is option 3."]},{"type":"FS","level":1,"shapes":["hook"],"given":[[[3,0,90,"green"]],[[3,1,90,"green"]],[[3,2,90,"green"]],[[3,3,90,"green"]]],"q5":[[[3,3,90,"green"]],[[2,3,90,"white"]],[[2,3,90,"green"]]],"a5":2,"q6":[[[0,3,90,"green"]],[[1,3,90,"green"]],[[1,3,0,"green"]]],"a6":1,"logic":["The green hook moves counter-clockwise along the outer border one field at a time.","Continue every rule two more steps: Matrix 5 is option 3, Matrix 6 is option 2."]},{"type":"FS","level":1,"shapes":["arrow"],"given":[[[0,0,0,"black"]],[[1,0,0,"black"]],[[2,0,0,"black"]],[[3,0,0,"black"]]],"q5":[[[3,0,0,"black"]],[[2,0,0,"black"]],[[2,1,0,"black"]]],"a5":1,"q6":[[[1,1,0,"black"]],[[1,0,0,"black"]],[[2,0,0,"black"]]],"a6":1,"logic":["The black arrow moves vertically one field at a time in the first column, first moving down, and bounces off the top/bottom border.","Continue every rule two more steps: Matrix 5 is option 2, Matrix 6 is option 2."]},{"type":"FS","level":1,"shapes":["wedge"],"given":[[[0,3,90,"blue"]],[[0,2,90,"blue"]],[[0,1,90,"blue"]],[[0,0,90,"blue"]]],"q5":[[[1,0,90,"blue"]],[[0,0,90,"blue"]],[[1,0,0,"blue"]]],"a5":0,"q6":[[[1,0,90,"blue"]],[[3,0,90,"blue"]],[[2,0,90,"blue"]]],"a6":2,"logic":["The blue wedge moves counter-clockwise along the outer border one field at a time.","Continue every rule two more steps: Matrix 5 is option 1, Matrix 6 is option 3."]},{"type":"FS","level":1,"shapes":["hook"],"given":[[[1,1,270,"blue"]],[[1,2,270,"blue"]],[[1,3,270,"blue"]],[[1,2,270,"blue"]]],"q5":[[[1,1,270,"blue"]],[[1,1,270,"yellow"]],[[0,0,270,"blue"]]],"a5":0,"q6":[[[2,1,270,"blue"]],[[1,1,270,"blue"]],[[1,0,270,"blue"]]],"a6":2,"logic":["The blue hook moves horizontally one field at a time in the second row, first moving right, and bounces off the left/right border.","Continue every rule two more steps: Matrix 5 is option 1, Matrix 6 is option 3."]},{"type":"FS","level":1,"shapes":["flag"],"given":[[[2,0,0,"blue"]],[[2,1,0,"blue"]],[[2,2,0,"blue"]],[[2,3,0,"blue"]]],"q5":[[[2,2,270,"blue"]],[[2,2,90,"blue"]],[[2,2,0,"blue"]]],"a5":2,"q6":[[[2,2,0,"blue"]],[[2,1,0,"blue"]],[[2,1,0,"pink"]]],"a6":1,"logic":["The blue flag moves horizontally one field at a time in the third row, first moving right, and bounces off the left/right border.","Continue every rule two more steps: Matrix 5 is option 3, Matrix 6 is option 2."]},{"type":"FS","level":1,"shapes":["wedge"],"given":[[[3,0,90,"black"]],[[2,0,90,"black"]],[[1,0,90,"black"]],[[0,0,90,"black"]]],"q5":[[[1,0,0,"black"]],[[0,0,90,"black"]],[[1,0,90,"black"]]],"a5":2,"q6":[[[1,0,90,"black"]],[[2,0,0,"black"]],[[2,0,90,"black"]]],"a6":2,"logic":["The black wedge moves vertically one field at a time in the first column, first moving up, and bounces off the top/bottom border.","Continue every rule two more steps: Matrix 5 is option 3, Matrix 6 is option 3."]},{"type":"FS","level":1,"shapes":["hook"],"given":[[[3,0,180,"blue"]],[[3,1,180,"blue"]],[[3,2,180,"blue"]],[[3,3,180,"blue"]]],"q5":[[[2,1,180,"blue"]],[[3,2,180,"blue"]],[[3,3,180,"blue"]]],"a5":1,"q6":[[[3,1,180,"blue"]],[[3,2,180,"blue"]],[[2,1,180,"blue"]]],"a6":0,"logic":["The blue hook moves horizontally one field at a time in the fourth row, first moving right, and bounces off the left/right border.","Continue every rule two more steps: Matrix 5 is option 2, Matrix 6 is option 1."]},{"type":"FS","level":1,"shapes":["flag"],"given":[[[0,3,90,"black"]],[[0,2,90,"black"]],[[0,1,90,"black"]],[[0,0,90,"black"]]],"q5":[[[1,1,90,"black"]],[[0,1,90,"black"]],[[0,0,90,"black"]]],"a5":1,"q6":[[[0,2,90,"black"]],[[0,1,90,"black"]],[[0,2,180,"black"]]],"a6":0,"logic":["The black flag moves horizontally one field at a time in the first row, first moving left, and bounces off the left/right border.","Continue every rule two more steps: Matrix 5 is option 2, Matrix 6 is option 1."]},{"type":"FS","level":1,"shapes":["wedge"],"given":[[[2,3,180,"white"]],[[3,3,180,"white"]],[[3,2,180,"white"]],[[3,1,180,"white"]]],"q5":[[[2,0,180,"white"]],[[3,1,180,"white"]],[ const GAM = [{"id": 1, "title": "GAM Practice Set 1", "passages": [{"title": "Price Elasticity of Demand", "area": "Economics", "level": 2, "text": ["Price elasticity of demand (PED) measures how strongly the quantity demanded of a good reacts to a change in its price. It is calculated as the percentage change in quantity demanded divided by the percentage change in price. Because price and quantity usually move in opposite directions, economists normally report the absolute value.", "If the absolute value of PED is greater than 1, demand is called elastic: quantity reacts more than proportionally to price. If it is less than 1, demand is inelastic. If it equals exactly 1, demand is unit elastic. Goods with few substitutes, or that are necessities, tend to have inelastic demand; goods with many close substitutes tend to have elastic demand.", "A firm's total revenue equals price multiplied by quantity sold (R = P × Q). When demand is elastic, a price increase reduces total revenue, because the fall in quantity outweighs the higher price. When demand is inelastic, a price increase raises total revenue. When demand is unit elastic, a small price change leaves total revenue unchanged.", "To avoid getting different results depending on the direction of a change, the midpoint method is often used: each percentage change is calculated relative to the average of the starting and ending values rather than the starting value alone."], "questions": [{"q": "The price of a streaming subscription rises by 10 %, and the number of subscribers falls by 25 %. Which statement is correct?", "options": ["PED = 0.4; demand is inelastic.", "PED = 2.5; demand is elastic.", "PED = 2.5; demand is inelastic.", "PED = 15; demand is elastic."], "answer": 1, "logic": "PED = 25 % ÷ 10 % = 2.5. Since 2.5 > 1, demand is elastic (paragraph 2)."}, {"q": "A firm knows that demand for its product is inelastic. What should it do if its only goal is to increase total revenue?", "options": ["Lower the pr s large", "Four times as large"], "answer": 3, "logic": "Series: each lamp gets V/2, so P = (V/2)² ÷ R = V²/(4R). Parallel: each lamp gets V, so P = V² ÷ R. Ratio = 4."}]}, {"title": "Moments and Levers", "area": "Engineering / Mechanics", "level": 3, "text": ["The turning effect of a force about a pivot is called its moment. It equals the force multiplied by the perpendicular distance from the pivot to the line of action of the force: M = F × d, measured in newton-metres (N m).", "A rigid body is in equilibrium when the sum of the clockwise moments about any point equals the sum of the anticlockwise moments, and the upward forces balance the downward forces.", "The weight of a uniform beam can be treated as a single force acting at its midpoint. A force whose line of action passes through the pivot has zero moment about that pivot.", "A lever lets a small effort move a large load. Its mechanical advantage (MA) is load ÷ effort. For a lever in equilibrium, MA equals the effort's distance from the pivot divided by the load's distance from the pivot."], "questions": [{"q": "On a seesaw, a child weighing 300 N sits 2.0 m to the left of the pivot. Where must a child weighing 400 N sit to balance it?", "options": ["1.5 m to the right", "2.0 m to the right", "2.7 m to the right", "1.5 m to the left"], "answer": 0, "logic": "Balance moments: 300 × 2.0 = 400 × d → d = 600 ÷ 400 = 1.5 m, on the opposite (right) side."}, {"q": "A crowbar pivots on a stone. The load is 0.3 m from the pivot and the effort is applied 1.2 m from the pivot. The load is 800 N. What are the effort and the MA?", "options": ["Effort 200 N, MA 4", "Effort 3,200 N, MA 0.25", "Effort 200 N, MA 0.25", "Effort 400 N, MA 2"], "answer": 0, "logic": "800 × 0.3 = E × 1.2 → E = 240 ÷ 1.2 = 200 N. MA = 800 ÷ 200 = 4 (also 1.2 ÷ 0.3 = 4)."}, {"q": "A uniform 4 m beam weighing 200 N is pivoted at its midpoint. A 100 N load hangs 0.5 m left of the pivot. What downward force at the right end keeps it level?", "optio function mx(state, shapes, size=112){
  const c=size/4; let s=`<svg class="mx" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="matrix">`;
  for(let i=0;i<=4;i++){s+=`<line x1="0" y1="${i*c}" x2="${size}" y2="${i*c}" stroke="#8a93a0" stroke-width="1.2"/><line x1="${i*c}" y1="0" x2="${i*c}" y2="${size}" stroke="#8a93a0" stroke-width="1.2"/>`}
  state.forEach((f,i)=>{const [r,cc,rot,col]=f;const a=rot*Math.PI/180;
    const pts=SHP[shapes[i]].map(([x,y])=>{const dx=x-.5,dy=y-.5;const rx=dx*Math.cos(a)-dy*Math.sin(a),ry=dx*Math.sin(a)+dy*Math.cos(a);return ((cc+.5+rx*.9)*c).toFixed(1)+","+((r+.5+ry*.9)*c).toFixed(1)}).join(" ");
    s+=`<polygon points="${pts}" fill="${COL[col]}" stroke="#1b1b1b" stroke-width="1.4"/>`});
  return s+"</svg>";
}

function mockMenu(m){

}

function startCore(m,secs,mode){
  run={kind:"core",m,secs,mode,si:0,qi:0,ans:{},checked:{},results:{}};
  startSection();
}
function startSection(){
  const s=run.secs[run.si]; run.qi=0; run.ans[s]=run.ans[s]||{}; run.checked[s]=run.checked[s]||{};
  if(run.mode=="exam"){run.left=SECS[s].min*60;run.total=run.left;clearInterval(timer);timer=setInterval(tick,1000)}
  renderQ();
}
function tick(){run.left--; const c=$(".clock"); if(c){c.textContent=fmt(run.left);c.classList.toggle("low",run.left<=120)} const tl=$(".timeline div"); if(tl) tl.style.width=(100*run.left/run.total)+"%"; if(run.left<=0){clearInterval(timer);finishSection()}}
const fmt=t=>String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");

function items(){return run.kind=="core"?CORE[run.m-1][run.secs[run.si]]:run.flat}
function secKey(){return run.kind=="core"?run.secs[run.si]:"GAM"}

function renderQ(){
  const s=secKey(), its=items(), it=its[run.qi], a=run.ans[s][run.qi], showing = run.mode=="practice" && run.checked[s][run.qi];
  const title = run.kind=="core"?`Mock ${run.m} · ${SECS[s].name}`:`GAM Set ${run.g}`;
  let h=`<div class="bar"><div class="barrow"><b>${title}</b>${run.mode=="exam"?`<span class="clock">${fmt(run.left)}</span>`:`<span class="muted">Practice mode</span>`}</div>${run.mode=="exam"?`<div class="timeline"><div style="width:${100*run.left/run.total}%"></div></div>`:""}
  <div class="nav">${its.map((_,i)=>{const aa=run.ans[s][i];const answered=aa!=null&&(its[i].type!="FS"||(aa&&aa[0]!=null&&aa[1]!=null));let cls=answered?"ans":"";if(run.mode=="practice"&&run.checked[s][i])cls=isRight(its[i],run.ans[s][i])?"r-ok":"r-bad";return `<button class="${cls} ${i==run.qi?"cur":""}" data-go="${i}" aria-label="Question ${i+1}">${i+1}</button>`}).join("")}</div></div>`;
  h+=`<div class="card"><div class="qhead"><span>Question ${run.qi+1} of ${its.length}</span><span>${it.level?"Difficulty "+it.level+"/5":""}</span></div>`;
  h+=body(it,a,showing);
  if(showing) h+=logicBox(it);
  h+=`</div><div class="row"><button class="btn" id="prev" ${run.qi==0?"disabled":""}>Previous</button>
  ${run.mode=="practice"&&!showing?`<button class="btn" id="check" ${a==null?"disabled":""}>Check answer</button>`:""}
  ${run.qi<its.length-1?`<button class="btn primary" id="next">Next</button>`:`<button class="btn primary" id="fin">${run.kind=="core"&&run.si<run.secs.length-1?"Finish subtest":"Finish and see results"}</button>`}</div>
  <div class="row"><button class="btn" id="quit">Leave test</button></div>`;
  $("#app").innerHTML=h; window.scrollTo(0,0);
  wire(it,s);
}
function body(it,a,showing,noP){
  let h="";
  if(it.type=="ME"){
    h+=`<p class="stem">Every letter is a whole number from 1 to 20. Which values solve all the equations?</p><div class="eqs">${it.eqs.map(esc).join("<br>")}</div><div class="opts">`;
    it.options.forEach((o,i)=>{h+=`<button class="opt ${showing?(i==it.answer?"right":(a==i?"wrong":"")):""}" aria-pressed="${a==i}" data-o="${i}"><span class="k">${"ABCD"[i]}</span>${esc(o)}</button>`});
    h+=`</div>`;
  } else if(it.type=="LS"){
    h+=`<p class="stem">Each letter A–E appears once in every row and every column. Which letter belongs in the highlighted cell?</p><div class="lsrow"><table class="ls"><tr><th></th>${[1,2,3,4,5].map(c=>`<th>C${c}</th>`).join("")}</tr>`;
    it.grid.forEach((row,r)=>{h+=`<tr><th>R${r+1}</th>`;[...row].forEach((ch,c)=>{const t=r==it.target[0]&&c==it.target[1];h+=`<td class="${t?"t":""}">${t?"?":(ch=="."?"":ch)}</td>`});h+="</tr>"});
    h+=`</table><div class="letters">${it.options.map((o,i)=>`<button class="opt ${showing?(i==it.answer?"right":(a==i?"wrong":"")):""}" aria-pressed="${a==i}" data-o="${i}">${o}</button>`).join("")}</div></div>`;
  } else if(it.type=="FS"){
    const sz = Math.min(112, Math.floor((Math.min(window.innerWidth,980)-80)/4));
    h+=`<p class="stem">Find the rules. What do Matrix 5 and Matrix 6 look like?</p><div class="fsgiven">${it.given.map((g,i)=>`<div class="fsbox">${mx(g,it.shapes,sz)}Matrix ${i+1}</div>`).join("")}</div>`;
    [["q5","a5","Matrix 5"],["q6","a6","Matrix 6"]].forEach(([q,ak,lab],k)=>{
      const sel=a?a[k]:null;
      h+=`<div class="fsq"><h4>${lab}</h4><div class="fsopts">${it[q].map((st,i)=>`<button class="fsopt ${showing?(i==it[ak]?"right":(sel==i?"wrong":"")):""}" aria-pressed="${sel==i}" data-f="${k}" data-o="${i}">${mx(st,it.shapes,sz)}Option ${i+1}</button>`).join("")}</div></div>`});
  } else {
    const p=it.passage;
    if(!noP) h+=`<div class="passage"><h3>${esc(p.title)}</h3><p class="muted" style="font-size:14px">${esc(p.area)}</p>${p.text.map(x=>`<p>${esc(x)}</p>`).join("")}</div>`; h+=`<p class="stem">${esc(it.q)}</p><div class="opts">`;
    it.options.forEach((o,i)=>{h+=`<button class="opt ${showing?(i==it.answer?"right":(a==i?"wrong":"")):""}" aria-pressed="${a==i}" data-o="${i}"><span class="k">${"abcd"[i]}</span>${esc(o)}</button>`});
    h+=`</div>`;
  }
  return h;
}
function logicBox(it){
  let L = Array.isArray(it.logic)?it.logic.slice():[it.logic]; let intro="";
  if(it.type=="LS"){intro=L.shift(); L=L.filter(x=>!x.startsWith("Answer:"))}
  if(it.type=="FS"){L=L.filter(x=>!x.startsWith("Continue every rule"))}
  const ans = it.type=="FS"?`Matrix 5: option ${it.a5+1} · Matrix 6: option ${it.a6+1}`: it.type=="LS"?`Answer: ${it.options[it.answer]}`: `Answer: ${(it.type=="GAM"?"abcd":"ABCD")[it.answer]} — ${esc(it.options[it.answer])}`;
  return `<div class="logic"><h4>${ans}</h4>${intro?`<p style="margin:0 0 4px">${esc(intro)}</p>`:""}${it.type=="FS"?`<p style="margin:0 0 4px">Rules for each figure — apply them two more steps:</p>`:""}<ol>${L.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`;
}
function isRight(it,a){if(a==null)return false;if(it.type=="FS")return a[0]==it.a5&&a[1]==it.a6;return a==it.answer}
function wire(it,s){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{run.qi=+b.dataset.go;renderQ()});
  const locked = run.mode=="practice"&&run.checked[s][run.qi];
  if(!locked){
    document.querySelectorAll(".opt[data-o]").forEach(b=>b.onclick=()=>{run.ans[s][run.qi]=+b.dataset.o;renderQ()});
    document.querySelectorAll(".fsopt").forEach(b=>b.onclick=()=>{const cur=run.ans[s][run.qi]||[null,null];cur[+b.dataset.f]=+b.dataset.o;run.ans[s][run.qi]=cur;renderQ()});
  }
  const pv=$("#prev"); if(pv) pv.onclick=()=>{run.qi--;renderQ()};
  const nx=$("#next"); if(nx) nx.onclick=()=>{run.qi++;renderQ()};
  const ck=$("#check"); if(ck){ if(it.type=="FS"){const a=run.ans[s][run.qi];ck.disabled=!(a&&a[0]!=null&&a[1]!=null)} ck.onclick=()=>{run.checked[s][run.qi]=true;renderQ()}}
  const fn=$("#fin"); if(fn) fn.onclick=()=>{const its=items();const open=its.filter((x,i)=>{const a=run.ans[s][i];return a==null||(x.type=="FS"&&(a[0]==null||a[1]==null))}).length; if(open&&!confirm(`${open} question${open>1?"s are":" is"} unanswered. Finish anyway? (In the real test, always guess.)`))return; finishSection()};
  $("#quit").onclick=()=>{if(confirm("Leave this test? Progress in this attempt is lost.")){clearInterval(timer);home()}};
}
function finishSection(){
  clearInterval(timer);
  const s=secKey(), its=items(); const score=its.filter((it,i)=>isRight(it,run.ans[s][i])).length;
  run.results[s]=score;
  if(run.kind=="core"){const k=`m${run.m}${s}`;const b=store.get(k);if(b==null||score>b)store.set(k,score)}
  else {const k=`g${run.g}`;const b=store.get(k);if(b==null||score>b)store.set(k,score)}
  if(run.kind=="core"&&run.si<run.secs.length-1){
    $("#app").innerHTML=`<div class="card"><h2 style="margin-top:0">${SECS[s].name}: ${score}/20</h2><p>Next: ${SECS[run.secs[run.si+1]].name}. In the real exam the three subtests run back to back.</p><button class="btn primary" id="go">Start ${SECS[run.secs[run.si+1]].name}</button></div>`;
    $("#go").onclick=()=>{run.si++;startSection()}; return;
  }
  results();
}
function results(){
  const keys=Object.keys(run.results);
  let h=`<button class="btn" id="back">Back to all ${run.kind=="core"?"mocks":"sets"}</button><h2>${run.kind=="core"?"Mock "+run.m:"GAM Set "+run.g} results</h2><div class="res">${keys.map(k=>{const n=run.kind=="core"?20:run.flat.length;return `<div><span class="muted">${k=="GAM"?"General Academic Module":SECS[k].name}</span><b>${run.results[k]}/${n}</b><span class="muted">${Math.round(100*run.results[k]/n)} %</span></div>`}).join("")}</div>`;
  h+=`<h3>Review with answer logic</h3>`;
  keys.forEach(k=>{
    const its=k=="GAM"?run.flat:CORE[run.m-1][k];
    h+=`<details ${keys.length==1?"open":""}><summary style="cursor:pointer;font-weight:700;margin:10px 0">${k=="GAM"?"All questions":SECS[k].name}</summary>`;
    its.forEach((it,i)=>{const a=run.ans[k][i];const ok=isRight(it,a);
      h+=`<div class="card" style="margin:10px 0"><div class="qhead"><span>Question ${i+1}</span><span style="color:var(${ok?"--ok":"--bad"})">${ok?"Correct":"Incorrect"}</span></div>${body(it,a,true,it.type=="GAM"&&i>0&&its[i-1].passage===it.passage)}${logicBox(it)}</div>`});
    h+=`</details>`;
  });
  $("#app").innerHTML=h; window.scrollTo(0,0);
  $("#back").onclick=home;
  document.querySelectorAll(".opt,.fsopt").forEach(b=>b.disabled=true);
}
function gamMenu(g){
  const set=GAM.find(x=>x.id==g);
  $("#app").innerHTML=`<button class="btn" id="back">Back to GAM sets</button><h2>${set.title}</h2><p class="muted">${set.passages.map(p=>esc(p.title)+" ("+esc(p.area)+")").join(" · ")}</p><div class="modes"><button class="mode" data-mode="exam"><h3>Exam mode</h3><p>45 minutes for four passages. Logic at the end.</p></button><button class="mode" data-mode="practice"><h3>Practice mode</h3><p>No clock. Logic after each answer.</p></button></div>`;
  $("#back").onclick=()=>{view.tab="gam";home()};
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
    const flat=[];set.passages.forEach(p=>p.questions.forEach(q=>flat.push({...q,type:"GAM",passage:p,level:p.level})));
    run={kind:"gam",g,mode:b.dataset.mode,flat,qi:0,ans:{GAM:{}},checked:{GAM:{}},results:{}};
    if(run.mode=="exam"){run.left=45*60;run.total=run.left;clearInterval(timer);timer=setInterval(tick,1000)}
    renderQ()});
}
home();
</script>
</body>
